name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4        # PR merged into current main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit