name: Bug report
description: Report a reproducible problem in CodeLingo.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Describe what is going wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give clear steps that another teammate can follow.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead?
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, screen size, and relevant version information.
      placeholder: Chrome on Windows 11, desktop...
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots / logs
      description: Add screenshots or relevant error messages. Remove secrets and personal data.
    validations:
      required: false
